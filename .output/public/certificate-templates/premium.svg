<svg xmlns="http://www.w3.org/2000/svg" width="1122" height="794" viewBox="0 0 1122 794" role="img" aria-labelledby="title desc">
  <title id="title">MySkyParcel Premium Sertifika</title>
  <desc id="desc">MySkyParcel premium certificate template</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050914"/><stop offset=".45" stop-color="#17243a"/><stop offset="1" stop-color="#050811"/></linearGradient>
    <linearGradient id="platinum" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b6d30"/><stop offset=".25" stop-color="#fff0aa"/><stop offset=".5" stop-color="#b89342"/><stop offset=".75" stop-color="#fff0aa"/><stop offset="1" stop-color="#8b6d30"/></linearGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#f2d37a" stop-opacity=".22"/><stop offset="1" stop-color="#f2d37a" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1122" height="794" fill="url(#bg)"/>
  <circle cx="561" cy="350" r="280" fill="url(#halo)"/>
  <rect x="24" y="24" width="1074" height="746" rx="22" fill="none" stroke="url(#platinum)" stroke-width="3"/>
  <rect x="40" y="40" width="1042" height="714" rx="17" fill="none" stroke="#e2c56c" stroke-opacity=".3"/>
  <g stroke="#d9bc63" fill="none" stroke-width="2" opacity=".7"><path d="M70 180V70h110M1052 180V70H942M70 614v110h110M1052 614v110H942"/><circle cx="561" cy="94" r="25"/><path d="M541 94h40M561 74v40"/></g>
  <text x="561" y="101" text-anchor="middle" fill="#fff1b0" font-family="Georgia,serif" font-size="30" letter-spacing="7">MY SKY PARCEL</text>
  <text x="561" y="169" text-anchor="middle" fill="#d7b85b" font-family="Arial,sans-serif" font-size="15" letter-spacing="10">PREMIUM COLLECTION</text>
  <text x="561" y="245" text-anchor="middle" fill="#fff2b5" font-family="Georgia,serif" font-size="17" letter-spacing="5">CERTIFICATE OF DIGITAL OWNERSHIP</text>
  <text x="561" y="350" text-anchor="middle" fill="#ffffff" font-family="Georgia,serif" font-size="{{HOLDER_NAME_FONT_SIZE}}" font-style="italic">{{HOLDER_NAME}}</text>
  <path d="M235 380H887" stroke="url(#platinum)" stroke-width="2"/>
  <text x="561" y="430" text-anchor="middle" fill="#f0d98e" font-family="monospace" font-size="25" letter-spacing="3">{{PARCEL_CODE}}</text>
  <text x="561" y="468" text-anchor="middle" fill="#c8d0dc" font-family="Arial,sans-serif" font-size="15" letter-spacing="2">{{CITY_NAME}} • PREMIUM</text>
  <text x="561" y="526" text-anchor="middle" fill="#8998aa" font-family="Arial,sans-serif" font-size="10" letter-spacing="3">SERTİFİKA NUMARASI</text>
  <text x="561" y="553" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="18">{{CERTIFICATE_NUMBER}}</text>
  <text x="86" y="699" fill="#8d9bae" font-family="Arial,sans-serif" font-size="11">DÜZENLENME: {{ISSUE_DATE}}</text>
  <text x="1036" y="699" text-anchor="end" fill="#8d9bae" font-family="monospace" font-size="10">{{FINGERPRINT_SHORT}}</text>
  <rect x="900" y="535" width="140" height="140" rx="10" fill="#fff"/>
  <image x="910" y="545" width="120" height="120" preserveAspectRatio="xMidYMid meet" href="{{QR_IMAGE_URL}}"/>
  <text x="970" y="690" text-anchor="middle" fill="#8d9bae" font-family="Arial,sans-serif" font-size="10">MY SKYPARCEL DOĞRULAMA</text>
</svg>
