---
# MySkyParcel — cPanel / CloudLinux Passenger deployment
#
# Core runtime:
#   cPanel Git repository (/home/myskypar/repositories/mehmet-kan-1453)
#        ├─ app.js + .output/server  -> Passenger / Nitro SSR
#        └─ .output/public           -> public_html static assets
#
# This deployment file must also work when cPanel receives the source commit
# before GitHub Actions publishes the generated production-output commit.
# Therefore it validates the available build instead of rejecting the commit
# solely because of its commit message.
deployment:
  tasks:
    - export APPROOT=/home/myskypar/repositories/mehmet-kan-1453
    - export DEPLOYPATH=/home/myskypar/public_html

    # Refuse incomplete repositories/builds rather than publishing a broken app.
    - /bin/test -d "$APPROOT/.git"
    - /bin/test -f "$APPROOT/app.js"
    - /bin/test -f "$APPROOT/.output/server/index.mjs"
    - /bin/test -f "$APPROOT/.output/nitro.json"
    - /bin/test -d "$APPROOT/.output/public"
    - /bin/test -f "$APPROOT/public/.htaccess"
    - /bin/test "$(/usr/bin/find "$APPROOT/.output/public" -type f | /usr/bin/wc -l)" -gt 0

    - /bin/mkdir -p "$DEPLOYPATH"

    # Keep hashed assets from older builds so cached/open HTML cannot request
    # a removed hash and turn a normal version transition into a 500.
    - /bin/find "$DEPLOYPATH" -mindepth 1 -maxdepth 1 ! -name '.well-known' ! -name 'assets' -exec /bin/rm -rf {} +
    - /bin/mkdir -p "$DEPLOYPATH/assets"
    - /bin/cp -a "$APPROOT/.output/public/." "$DEPLOYPATH/"
    - /bin/cp -f "$APPROOT/public/.htaccess" "$DEPLOYPATH/.htaccess"

    # Record exactly which Git commit is live in public_html.
    - /bin/sh -c 'cd "$APPROOT" && /usr/bin/git rev-parse HEAD > "$DEPLOYPATH/__cpanel_build.txt" && /bin/date -u +%Y-%m-%dT%H:%M:%SZ >> "$DEPLOYPATH/__cpanel_build.txt"'

    # Passenger restart signal.
    - /bin/mkdir -p "$APPROOT/tmp"
    - /bin/touch "$APPROOT/tmp/restart.txt"

    # Final integrity checks after the files have been copied.
    - /bin/test -f "$DEPLOYPATH/.htaccess"
    - /bin/test -f "$DEPLOYPATH/__cpanel_build.txt"
    - /bin/test -d "$DEPLOYPATH/assets"
    - echo MySkyParcel cPanel deployment completed
