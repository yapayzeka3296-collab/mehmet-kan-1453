---
# MySkyParcel — cPanel / CloudLinux Passenger deployment
# Manual pull deployment: Update from Remote -> Deploy HEAD Commit.
# Each task is self-contained so cPanel's task runner does not depend on
# shell environment variables surviving between task entries.
deployment:
  tasks:
    - /bin/test -x /home/myskypar/nodevenv/repositories/mehmet-kan-1453/22/bin/node || { echo "ERROR: Node 22 not found"; exit 1; }
    - /bin/test -x /home/myskypar/nodevenv/repositories/mehmet-kan-1453/22/bin/npm || { echo "ERROR: npm not found"; exit 1; }
    - /bin/test -f /home/myskypar/repositories/mehmet-kan-1453/package.json || { echo "ERROR: package.json missing"; exit 1; }
    - /bin/test -f /home/myskypar/repositories/mehmet-kan-1453/package-lock.json || { echo "ERROR: package-lock.json missing"; exit 1; }
    - /bin/test -f /home/myskypar/repositories/mehmet-kan-1453/app.js || { echo "ERROR: app.js missing"; exit 1; }
    - /bin/test -f /home/myskypar/repositories/mehmet-kan-1453/public/.htaccess || { echo "ERROR: public/.htaccess missing"; exit 1; }
    - /bin/rm -rf /home/myskypar/repositories/mehmet-kan-1453/.output
    - cd /home/myskypar/repositories/mehmet-kan-1453 && NODE_ENV=production /home/myskypar/nodevenv/repositories/mehmet-kan-1453/22/bin/npm ci --include=dev --legacy-peer-deps --no-audit --no-fund
    - cd /home/myskypar/repositories/mehmet-kan-1453 && NODE_ENV=production /home/myskypar/nodevenv/repositories/mehmet-kan-1453/22/bin/npm run build:production
    - /bin/test -f /home/myskypar/repositories/mehmet-kan-1453/.output/server/index.mjs || { echo "ERROR: Nitro server output missing"; exit 1; }
    - /bin/test -d /home/myskypar/repositories/mehmet-kan-1453/.output/public || { echo "ERROR: Nitro public output missing"; exit 1; }
    - /bin/mkdir -p /home/myskypar/public_html /home/myskypar/repositories/mehmet-kan-1453/tmp
    - /bin/rm -f /home/myskypar/public_html/index.html
    - /bin/rm -rf /home/myskypar/public_html/assets /home/myskypar/public_html/_payload /home/myskypar/public_html/_nuxt /home/myskypar/public_html/_tanstack
    - /bin/cp -a /home/myskypar/repositories/mehmet-kan-1453/.output/public/. /home/myskypar/public_html/
    - /bin/cp -f /home/myskypar/repositories/mehmet-kan-1453/public/.htaccess /home/myskypar/public_html/.htaccess
    - /bin/rm -f /home/myskypar/public_html/index.html
    - /bin/test -f /home/myskypar/public_html/.htaccess || { echo "ERROR: .htaccess publish failed"; exit 1; }
    - /bin/touch /home/myskypar/repositories/mehmet-kan-1453/tmp/restart.txt
    - /bin/chmod -R u+rwX,go+rX /home/myskypar/repositories/mehmet-kan-1453/.output || true
    - /bin/chmod 644 /home/myskypar/repositories/mehmet-kan-1453/app.js /home/myskypar/public_html/.htaccess || true
    - echo "MySkyParcel cPanel deployment completed successfully."
