---
# cPanel/CloudLinux deployment for the TanStack Start + Nitro node-server build.
# The Node.js application owns both SSR routes and generated static assets.
# Do not copy .output/public into public_html: that bypasses Passenger and can
# expose a directory index instead of the running Nitro application.
deployment:
  tasks:
    - export APP_ROOT=/home/myskypar/repositories/mehmet-kan-1453
    - /bin/mkdir -p "$APP_ROOT/tmp"
    - /bin/touch "$APP_ROOT/tmp/restart.txt"
    - /bin/chmod -R u+rwX,go+rX "$APP_ROOT/.output" || true
    - /bin/chmod 644 "$APP_ROOT/app.js" || true
