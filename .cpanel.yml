---
# MySkyParcel production deployment: TanStack Start + Nitro node-server on cPanel.
# GitHub Actions publishes the generated .output directory; cPanel deploys the
# public assets and restarts the Passenger application.
deployment:
  tasks:
    - export APP_ROOT=/home/myskypar/repositories/mehmet-kan-1453
    - export DOCUMENT_ROOT=/home/myskypar/public_html
    - /bin/mkdir -p "$DOCUMENT_ROOT"
    - /bin/mkdir -p "$APP_ROOT/tmp"
    # Remove stale static/framework artifacts.
    - /bin/rm -rf "$DOCUMENT_ROOT/assets" "$DOCUMENT_ROOT/_payload" "$DOCUMENT_ROOT/_nuxt" "$DOCUMENT_ROOT/_tanstack"
    # Nitro public output contains browser/static assets only.
    - /bin/cp -a "$APP_ROOT/.output/public/." "$DOCUMENT_ROOT/"
    # Passenger is enabled at the real domain document root. cPanel Setup Node.js
    # App supplies the application root, Node.js runtime and startup file.
    - /bin/printf '%s\n' '# MySkyParcel Passenger entry' 'PassengerEnabled On' 'Options -MultiViews -Indexes' > "$DOCUMENT_ROOT/.htaccess"
    # Passenger watches this file in the application root for a restart.
    - /bin/touch "$APP_ROOT/tmp/restart.txt"
    - /bin/chmod -R u+rwX,go+rX "$APP_ROOT/.output" || true
    - /bin/chmod 644 "$APP_ROOT/app.js" || true
