---
deployment:
  tasks:
    # The Git repository itself is the cPanel Node.js application root.
    # Do NOT copy .output/public into public_html: that bypasses Passenger/SSR.
    - export APPROOT=/home/myskypar/repositories/pixel-perfect-clone-14793
    - /bin/mkdir -p $APPROOT/tmp
    # Restart Passenger after each cPanel Git deployment.
    - /bin/touch $APPROOT/tmp/restart.txt
