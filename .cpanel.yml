---
deployment:
  tasks:
    # cPanel/CloudLinux Passenger application root.
    - export APPROOT=/home/myskypar/repositories/pixel-perfect-clone-14793
    # The domain currently uses /home/myskypar/public_html as its document root.
    # Keep SSR/Passenger in APPROOT, but publish the generated static assets to
    # Apache's document root so hashed JS/CSS/SVG files are not sent through SSR.
    - export PUBLICROOT=/home/myskypar/public_html
    - /bin/mkdir -p $APPROOT/tmp
    - /bin/mkdir -p $PUBLICROOT
    # .output is generated by GitHub Actions before cPanel deployment.
    # Copy public files only; the Nitro server stays under APPROOT/.output/server.
    - /bin/cp -a $APPROOT/.output/public/. $PUBLICROOT/
    # Restart Passenger after the new build and static assets are in place.
    - /bin/touch $APPROOT/tmp/restart.txt
