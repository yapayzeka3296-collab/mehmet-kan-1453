---
# MySkyParcel — cPanel / CloudLinux Passenger manual pull deployment
# cPanel flow: Update from Remote -> Deploy HEAD Commit.
# Keep the entire deployment in one Bash process so cd/env/error handling is reliable.
deployment:
  tasks:
    - /bin/bash -lc 'set -euo pipefail
      APP_ROOT="/home/myskypar/repositories/mehmet-kan-1453"
      DOCUMENT_ROOT="/home/myskypar/public_html"
      NODE_BIN="/home/myskypar/nodevenv/repositories/mehmet-kan-1453/22/bin"
      export NODE_ENV=production
      export NPM_CONFIG_PRODUCTION=false
      export PATH="$NODE_BIN:$PATH"

      echo "[MySkyParcel] deployment started"
      echo "[MySkyParcel] APP_ROOT=$APP_ROOT"
      echo "[MySkyParcel] DOCUMENT_ROOT=$DOCUMENT_ROOT"

      test -x "$NODE_BIN/node" || { echo "ERROR: Node 22 not found: $NODE_BIN/node"; exit 1; }
      test -x "$NODE_BIN/npm" || { echo "ERROR: npm not found: $NODE_BIN/npm"; exit 1; }
      test -f "$APP_ROOT/package.json" || { echo "ERROR: package.json missing"; exit 1; }
      test -f "$APP_ROOT/package-lock.json" || { echo "ERROR: package-lock.json missing"; exit 1; }
      test -f "$APP_ROOT/app.js" || { echo "ERROR: app.js missing"; exit 1; }
      test -f "$APP_ROOT/public/.htaccess" || { echo "ERROR: public/.htaccess missing"; exit 1; }
      test -f "$APP_ROOT/.cpanel.yml" || { echo "ERROR: .cpanel.yml missing"; exit 1; }

      cd "$APP_ROOT"
      echo "[MySkyParcel] node: $($NODE_BIN/node --version)"
      echo "[MySkyParcel] npm: $($NODE_BIN/npm --version)"

      rm -rf "$APP_ROOT/.output"
      "$NODE_BIN/npm" ci --include=dev --legacy-peer-deps --no-audit --no-fund
      "$NODE_BIN/npm" run build:production

      test -f "$APP_ROOT/.output/server/index.mjs" || { echo "ERROR: Nitro server output missing"; exit 1; }
      test -d "$APP_ROOT/.output/public" || { echo "ERROR: Nitro public output missing"; exit 1; }

      mkdir -p "$DOCUMENT_ROOT" "$APP_ROOT/tmp"
      rm -f "$DOCUMENT_ROOT/index.html"
      rm -rf "$DOCUMENT_ROOT/assets" "$DOCUMENT_ROOT/_payload" "$DOCUMENT_ROOT/_nuxt" "$DOCUMENT_ROOT/_tanstack"
      cp -a "$APP_ROOT/.output/public/." "$DOCUMENT_ROOT/"
      cp -f "$APP_ROOT/public/.htaccess" "$DOCUMENT_ROOT/.htaccess"
      rm -f "$DOCUMENT_ROOT/index.html"

      test -f "$DOCUMENT_ROOT/.htaccess" || { echo "ERROR: .htaccess publish failed"; exit 1; }
      touch "$APP_ROOT/tmp/restart.txt"
      chmod -R u+rwX,go+rX "$APP_ROOT/.output" || true
      chmod 644 "$APP_ROOT/app.js" "$DOCUMENT_ROOT/.htaccess" || true

      echo "[MySkyParcel] deployment completed successfully"'
