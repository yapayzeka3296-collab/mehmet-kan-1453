---
# MySkyParcel — cPanel / CloudLinux Passenger deployment
# Build Nitro in the cPanel Node 22 environment, publish only public assets,
# then restart the Passenger application.
deployment:
  tasks:
    - export APP_ROOT=/home/myskypar/repositories/mehmet-kan-1453
    - export DOCUMENT_ROOT=/home/myskypar/public_html
    - export NODE_ENV=production
    - export NPM_CONFIG_PRODUCTION=false
    - export NODE_BIN=/home/myskypar/nodevenv/repositories/mehmet-kan-1453/22/bin
    - export PATH="$NODE_BIN:$PATH"
    - cd "$APP_ROOT"
    - /bin/test -x "$NODE_BIN/node"
    - /bin/test -x "$NODE_BIN/npm"
    - "$NODE_BIN/node" --version
    - "$NODE_BIN/npm" --version
    - /bin/rm -rf "$APP_ROOT/.output"
    - "$NODE_BIN/npm" ci --include=dev --legacy-peer-deps --no-audit --no-fund
    - "$NODE_BIN/npm" run build:production
    - /bin/test -f "$APP_ROOT/.output/server/index.mjs"
    - /bin/test -f "$APP_ROOT/.output/nitro.json"
    - /bin/test -d "$APP_ROOT/.output/public"
    - /bin/test -f "$APP_ROOT/app.js"
    - /bin/test -f "$APP_ROOT/public/.htaccess"
    - /bin/mkdir -p "$DOCUMENT_ROOT" "$APP_ROOT/tmp"
    - /bin/rm -f "$DOCUMENT_ROOT/index.html"
    - /bin/rm -rf "$DOCUMENT_ROOT/assets" "$DOCUMENT_ROOT/_payload" "$DOCUMENT_ROOT/_nuxt" "$DOCUMENT_ROOT/_tanstack"
    - /bin/cp -a "$APP_ROOT/.output/public/." "$DOCUMENT_ROOT/"
    - /bin/cp -f "$APP_ROOT/public/.htaccess" "$DOCUMENT_ROOT/.htaccess"
    - /bin/rm -f "$DOCUMENT_ROOT/index.html"
    - /bin/test -f "$DOCUMENT_ROOT/.htaccess"
    - /bin/touch "$APP_ROOT/tmp/restart.txt"
    - /bin/chmod -R u+rwX,go+rX "$APP_ROOT/.output" || true
    - /bin/chmod 644 "$APP_ROOT/app.js" "$DOCUMENT_ROOT/.htaccess" || true
