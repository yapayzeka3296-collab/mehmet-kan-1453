---
# MySkyParcel production deployment: TanStack Start + Nitro node-server on cPanel.
# GitHub Actions publishes the generated .output directory; cPanel only deploys
# the public assets and restarts the Passenger application.
deployment:
  tasks:
    - export APP_ROOT=/home/myskypar/repositories/mehmet-kan-1453
    - export DOCUMENT_ROOT=/home/myskypar/public_html
    - /bin/mkdir -p "$DOCUMENT_ROOT"
    - /bin/mkdir -p "$APP_ROOT/tmp"
    # Remove obsolete static-framework artifacts, but preserve the intentional
    # public/.htaccess that enables Passenger at the document root.
    - /bin/rm -rf "$DOCUMENT_ROOT/assets" "$DOCUMENT_ROOT/_payload" "$DOCUMENT_ROOT/_nuxt" "$DOCUMENT_ROOT/_tanstack"
    - /bin/cp -a "$APP_ROOT/.output/public/." "$DOCUMENT_ROOT/"
    - /bin/touch "$APP_ROOT/tmp/restart.txt"
    - /bin/chmod -R u+rwX,go+rX "$APP_ROOT/.output" || true
    - /bin/chmod 644 "$APP_ROOT/app.js" || true
