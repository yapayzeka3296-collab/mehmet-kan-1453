name: Security Fix

on:
  push:
    branches:
      - security-fix-run

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Apply compatible security fixes
        run: npm audit fix --package-lock-only
      - name: Verify audit
        run: npm audit --audit-level=high
      - name: Verify build
        run: npm run build
      - name: Verify TypeScript
        run: npx tsc --noEmit
      - name: Verify lint
        run: npm run lint
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- package-lock.json package.json; then
            echo "No dependency changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json
          git commit -m "chore: refresh audited dependencies"
          git push origin HEAD:security-fix-run
