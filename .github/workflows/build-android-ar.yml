name: Build MySkyParcel AR

on:
  push:
    branches:
      - feature/gokyuzunu-tara-ar
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-ar
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        env:
          ARCORE_API_KEY: ${{ secrets.ARCORE_API_KEY }}
        run: gradle assembleDebug -PARCORE_API_KEY="$ARCORE_API_KEY" --no-daemon

      # Build the complete Android scanner after every change on the AR branch.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MySkyParcel-AR-debug
          path: android-ar/app/build/outputs/apk/debug/app-debug.apk
