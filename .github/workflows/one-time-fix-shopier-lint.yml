name: One-time fix Shopier lint

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix comma expression lint error
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/routes/parsel-satin-al.tsx')
          s = p.read_text(encoding='utf-8')
          old = 'if (reason === "parcel_reserved_by_other_user") setItems([]), setReservationConflict(true);'
          new = 'if (reason === "parcel_reserved_by_other_user") { setItems([]); setReservationConflict(true); }'
          if old not in s:
              raise SystemExit('Expected lint expression not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Remove one-time workflow and commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/parsel-satin-al.tsx
          git rm .github/workflows/one-time-fix-shopier-lint.yml
          git commit -m "fix: resolve Shopier checkout lint error"
          git push
