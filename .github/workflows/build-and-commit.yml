name: Build, verify and deploy MySkyParcel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy-main
  cancel-in-progress: false

env:
  NODE_OPTIONS: --max-old-space-size=6144
  NODE_ENV: production
  NITRO_HOST: 127.0.0.1
  NITRO_PORT: 4173

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build production Nitro application
        run: npm run build:production

      - name: Validate production build
        shell: bash
        run: |
          set -euo pipefail
          test -f .output/server/index.mjs
          test -f .output/nitro.json
          test -d .output/public
          test -f app.js
          echo "Production build artifacts are present."

      - name: Start Nitro server for route smoke tests
        shell: bash
        run: |
          set -euo pipefail
          node app.js > /tmp/myskyparcel-nitro.log 2>&1 &
          echo $! > /tmp/myskyparcel-nitro.pid

          for attempt in {1..30}; do
            if curl -fsS --max-time 2 http://127.0.0.1:4173/ >/dev/null; then
              echo "Nitro server is ready."
              exit 0
            fi
            sleep 1
          done

          cat /tmp/myskyparcel-nitro.log
          exit 1

      - name: Smoke test every generated static route
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t routes < <(
            grep -oE "path: '[^']+'" src/routeTree.gen.ts \
              | sed -E "s/^path: '([^']+)'$/\1/" \
              | grep -v '\$' \
              | sort -u
          )

          failed=0
          tested=0

          for route in "${routes[@]}"; do
            tested=$((tested + 1))
            code="$(curl -sS -o /tmp/route-response -w '%{http_code}' --max-time 20 "http://127.0.0.1:4173${route}")" || code="000"

            case "$code" in
              2*|3*)
                echo "PASS $code $route"
                ;;
              *)
                echo "FAIL $code $route"
                failed=$((failed + 1))
                ;;
            esac
          done

          echo "Tested $tested static routes; failures: $failed"

          if [ "$failed" -ne 0 ]; then
            echo "--- Nitro log ---"
            cat /tmp/myskyparcel-nitro.log
            exit 1
          fi

      - name: Stop Nitro smoke-test server
        if: always()
        run: |
          if [ -f /tmp/myskyparcel-nitro.pid ]; then
            kill "$(cat /tmp/myskyparcel-nitro.pid)" 2>/dev/null || true
          fi

  deploy-cpanel:
    needs: build-and-verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact commit that passed verification
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check required deployment secrets
        env:
          CPANEL_REPO_URL: ${{ secrets.CPANEL_REPO_URL }}
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          CPANEL_KNOWN_HOSTS: ${{ secrets.CPANEL_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          missing=0
          for name in CPANEL_REPO_URL CPANEL_SSH_KEY CPANEL_KNOWN_HOSTS; do
            if [ -z "${!name:-}" ]; then
              echo "Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the three deployment secrets before production deployment can run."
            exit 1
          fi

      - name: Install SSH client
        run: sudo apt-get update -y && sudo apt-get install -y openssh-client

      - name: Configure SSH for cPanel Git repository
        shell: bash
        env:
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          CPANEL_KNOWN_HOSTS: ${{ secrets.CPANEL_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$CPANEL_SSH_KEY" > ~/.ssh/cpanel_deploy_key
          chmod 600 ~/.ssh/cpanel_deploy_key
          printf '%s\n' "$CPANEL_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Push verified commit to cPanel repository
        env:
          CPANEL_REPO_URL: ${{ secrets.CPANEL_REPO_URL }}
        run: |
          set -euo pipefail
          git remote add cpanel "$CPANEL_REPO_URL"
          GIT_SSH_COMMAND='ssh -i ~/.ssh/cpanel_deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes' git push cpanel HEAD:main

      - name: Deployment handoff complete
        run: echo "Verified main commit pushed to the cPanel-managed Git repository. cPanel's post-receive hook should now execute .cpanel.yml and restart Passenger."
