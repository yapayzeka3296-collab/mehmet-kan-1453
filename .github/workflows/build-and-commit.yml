name: Build and verify MySkyParcel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '.output/**'

permissions:
  contents: write

concurrency:
  group: production-build-main
  cancel-in-progress: false

env:
  NODE_OPTIONS: --max-old-space-size=6144
  NITRO_HOST: 127.0.0.1
  NITRO_PORT: 4173

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: production
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        env:
          NODE_ENV: development
          NPM_CONFIG_PRODUCTION: 'false'
        run: npm ci --include=dev --legacy-peer-deps --no-audit --no-fund
      - name: Generate TanStack route tree
        run: npm run prebuild
      - name: Verify generated public/legal route tree
        shell: bash
        run: |
          set -euo pipefail
          for route in \
            "./routes/ana-sayfa" "./routes/turkiye-haritasi" "./routes/nasil-calisir" \
            "./routes/paketler" "./routes/hakkimizda" "./routes/iletisim" "./routes/destek" \
            "./routes/pazar-yeri" "./routes/uyelik-sozlesmesi" "./routes/mesafeli-satis-sozlesmesi" \
            "./routes/on-bilgilendirme-formu" "./routes/iade-iptal-politikasi" "./routes/kvkk" \
            "./routes/gizlilik-politikasi" "./routes/kullanim-sartlari" "./routes/cerez-politikasi"; do
            grep -Fq "$route" src/routeTree.gen.ts
          done
      - name: TypeScript validation
        run: npm run typecheck -- --pretty false
      - name: ESLint validation
        run: npm run lint
      - name: Build production application
        run: npm run build:production
      - name: Start Nitro server
        shell: bash
        run: |
          set -euo pipefail
          node app.js > /tmp/myskyparcel-nitro.log 2>&1 &
          echo $! > /tmp/myskyparcel-nitro.pid
          for attempt in {1..30}; do
            if curl -fsS --max-time 2 http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/myskyparcel-nitro.log
          exit 1
      - name: Generate cPanel static public route HTML
        shell: bash
        run: |
          set -euo pipefail
          routes=(
            ana-sayfa turkiye-haritasi nasil-calisir paketler hakkimizda
            iletisim destek pazar-yeri
            uyelik-sozlesmesi mesafeli-satis-sozlesmesi on-bilgilendirme-formu
            iade-iptal-politikasi kvkk gizlilik-politikasi kullanim-sartlari
            cerez-politikasi
          )
          for route in "${routes[@]}"; do
            mkdir -p ".output/public/${route}"
            curl -fsS -L --max-time 20 "http://127.0.0.1:4173/${route}" > ".output/public/${route}/index.html"
            test -s ".output/public/${route}/index.html"
          done
      - name: Validate cPanel artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -f .output/server/index.mjs
          test -f .output/nitro.json
          test -d .output/public
          test -f app.js
          test -f public/.htaccess
          test "$(find .output/public -type f | wc -l)" -gt 0
          for route in \
            ana-sayfa turkiye-haritasi nasil-calisir paketler hakkimizda iletisim destek pazar-yeri \
            uyelik-sozlesmesi mesafeli-satis-sozlesmesi on-bilgilendirme-formu \
            iade-iptal-politikasi kvkk gizlilik-politikasi kullanim-sartlari cerez-politikasi; do
            test -s ".output/public/${route}/index.html"
          done
      - name: Smoke test application routes
        shell: bash
        run: |
          set -euo pipefail
          routes=(
            / /ana-sayfa /bildirimler /cerez-politikasi /dogrula /giris
            /gizlilik-politikasi /gokyuzu-haritasi /guvenlik-ayarlari /hakkimizda
            /hediye-kabul /hediyelerim /iade-iptal-politikasi /destek /iletisim
            /kayit-ol /kullanim-sartlari /kvkk /mesafeli-satis-sozlesmesi
            /nasil-calisir /on-bilgilendirme-formu /paketler /panelim
            /parsel-hatirasi /parsel-satin-al /parsellerim /pazar-yeri /profilim
            /sertifika-dogrula /sertifika-talep /sertifikalarim /sifre-yenile
            /sifremi-unuttum /siparislerim /turkiye-haritasi /uyelik-sozlesmesi /yonetim
          )
          for route in "${routes[@]}"; do
            code="$(curl -sS -L -o /tmp/route-response -w '%{http_code}' --max-time 20 "http://127.0.0.1:4173${route}")"
            case "$code" in 2*) echo "PASS $code $route";; *) echo "FAIL $code $route"; cat /tmp/route-response; exit 1;; esac
          done
          for city in istanbul gaziantep; do
            code="$(curl -sS -L -o /tmp/route-response -w '%{http_code}' --max-time 20 "http://127.0.0.1:4173/sehir/${city}")"
            case "$code" in 2*) echo "PASS $code /sehir/${city}";; *) echo "FAIL $code /sehir/${city}"; exit 1;; esac
          done
          code="$(curl -sS -o /tmp/route-response -w '%{http_code}' --max-time 20 'http://127.0.0.1:4173/api/earth-assets?type=provinces')"
          test "$code" = 200
          for api_route in /purchase /purchase-bulk /api/shopier/checkout; do
            code="$(curl -sS -o /tmp/route-response -w '%{http_code}' --max-time 20 -X POST -H 'content-type: application/json' -d '{}' "http://127.0.0.1:4173${api_route}")"
            case "$code" in 400|401|403) echo "PASS $code ${api_route}";; *) echo "FAIL $code ${api_route}"; exit 1;; esac
          done
          code="$(curl -sS -o /tmp/route-response -w '%{http_code}' --max-time 20 'http://127.0.0.1:4173/admin-check')"
          case "$code" in 401|403) echo "PASS $code /admin-check";; *) echo "FAIL $code /admin-check"; exit 1;; esac
      - name: Commit prebuilt Nitro output and generated route tree for cPanel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .output src/routeTree.gen.ts
          if git diff --cached --quiet -- .output src/routeTree.gen.ts; then
            echo "Production output and route tree unchanged."
          else
            git commit -m "build: update prebuilt production output"
            git push origin HEAD:main
          fi
      - name: Stop Nitro server
        if: always()
        run: |
          if [ -f /tmp/myskyparcel-nitro.pid ]; then kill "$(cat /tmp/myskyparcel-nitro.pid)" 2>/dev/null || true; fi

# cPanel deployment note: every source change must regenerate .output before cPanel pulls main.
# Verification trigger: static route generation runs before cPanel artifact validation.
