name: Build and Commit .output

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  build-and-commit:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Normalize Tailwind CSS entry
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/styles.css")
          text = path.read_text(encoding="utf-8")
          lines = text.splitlines()

          lines = [
              line for line in lines
              if line.strip() != '@import "./myskyparcel-theme-fallback.css";'
          ]

          imports = [line for line in lines if line.startswith("@import ")]
          rest = [line for line in lines if not line.startswith("@import ")]
          lines = ['@import "tailwindcss";'] + [
              line for line in imports
              if line.strip() != '@import "tailwindcss";'
          ] + rest

          path.write_text("\n".join(lines).rstrip() + "\n", encoding="utf-8")
          PY

      - name: Build project
        run: npm run build

      - name: Commit generated route tree, normalized CSS and .output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routeTree.gen.ts
          git add src/styles.css
          git add -f .output
          if git diff --cached --quiet; then
            echo "No generated route tree, CSS or .output changes to commit."
            exit 0
          fi
          git commit -m "build: update generated routes, CSS and .output [skip ci]"

          # Another automation can update main while this build is running.
          # Rebase the generated commit onto the newest main before pushing so
          # a harmless race does not turn the workflow red.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
