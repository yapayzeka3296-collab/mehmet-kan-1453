name: Build and Commit .output

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-and-commit-main
  cancel-in-progress: false

env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  build-and-commit:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build and publish generated files
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            echo "=== Build/publish attempt $attempt/3 ==="

            git fetch origin main
            git reset --hard origin/main

            python3 - <<'PY'
            from pathlib import Path

            path = Path("src/styles.css")
            text = path.read_text(encoding="utf-8")
            lines = text.splitlines()

            lines = [
                line for line in lines
                if line.strip() != '@import "./myskyparcel-theme-fallback.css";'
            ]

            imports = [line for line in lines if line.startswith("@import ")]
            rest = [line for line in lines if not line.startswith("@import ")]
            lines = ['@import "tailwindcss";'] + [
                line for line in imports
                if line.strip() != '@import "tailwindcss";'
            ] + rest

            path.write_text("\n".join(lines).rstrip() + "\n", encoding="utf-8")
            PY

            npm run build

            test -f .output/server/index.mjs
            test -f .output/nitro.json
            test -d .output/public

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/routeTree.gen.ts
            git add src/styles.css
            git add -f .output

            if git diff --cached --quiet; then
              echo "No generated route tree, CSS or .output changes to commit."
              exit 0
            fi

            git commit -m "build: update generated routes, CSS and .output [skip ci]"

            git fetch origin main
            if git diff --quiet HEAD origin/main; then
              git push origin HEAD:main
              echo "Generated build published successfully."
              exit 0
            fi

            echo "main changed during the build; retrying from the newest main."
            git reset --hard origin/main
          done

          echo "Could not publish generated files after 3 attempts."
          exit 1
