name: Build, verify and deploy MySkyParcel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-deploy-main
  cancel-in-progress: false

env:
  NODE_OPTIONS: --max-old-space-size=6144
  NITRO_HOST: 127.0.0.1
  NITRO_PORT: 4173

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.lock.outputs.changed }}
      commit_sha: ${{ steps.lock.outputs.commit_sha }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Regenerate package-lock from package.json
        env:
          NODE_ENV: development
          NPM_CONFIG_PRODUCTION: 'false'
        run: npm install --package-lock-only --include=dev --legacy-peer-deps --no-audit --no-fund

      - name: Commit synchronized lockfile when needed
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "package-lock.json is already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "ci: sync package-lock with package.json"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "package-lock.json was synchronized and the verified commit will be built in this workflow."

  build-and-verify:
    needs: sync-lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: production

    steps:
      - name: Checkout synchronized commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync-lockfile.outputs.commit_sha }}
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies including dev tools
        env:
          NODE_ENV: development
          NPM_CONFIG_PRODUCTION: 'false'
        run: npm ci --include=dev --legacy-peer-deps --no-audit --no-fund

      - name: Build production application
        env:
          NODE_ENV: production
        run: npm run build:production

      - name: Validate production artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -f .output/server/index.mjs
          test -f .output/nitro.json
          test -d .output/public
          test -f app.js
          test -f public/.htaccess
          find .output/public -type f | grep -E '\.(js|mjs|css|json|svg|woff2?|ttf|otf|wasm)$' >/dev/null
          echo "Production build artifacts and frontend assets are present."

      - name: Start Nitro server
        shell: bash
        run: |
          set -euo pipefail
          node app.js > /tmp/myskyparcel-nitro.log 2>&1 &
          echo $! > /tmp/myskyparcel-nitro.pid
          for attempt in {1..30}; do
            if curl -fsS --max-time 2 http://127.0.0.1:4173/ >/dev/null; then
              echo "Nitro server is ready."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/myskyparcel-nitro.log
          exit 1

      - name: Smoke test generated routes and critical routes
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          tested=0

          if [ -f src/routeTree.gen.ts ]; then
            mapfile -t routes < <(
              grep -oE "path: '[^']+'" src/routeTree.gen.ts \
                | sed -E "s/^path: '([^']+)'$/\1/" \
                | grep -v '\$' \
                | sort -u
            )
          else
            routes=()
          fi

          for route in "${routes[@]}" /iletisim /yonetim /sehir/istanbul /sehir/gaziantep /api/earth-assets; do
            tested=$((tested + 1))
            code="$(curl -sS -o /tmp/route-response -w '%{http_code}' --max-time 20 "http://127.0.0.1:4173${route}")" || code="000"
            case "$code" in
              2*|3*) echo "PASS $code $route" ;;
              *) echo "FAIL $code $route"; failed=$((failed + 1)) ;;
            esac
          done

          echo "Tested $tested routes; failures: $failed"
          if [ "$failed" -ne 0 ]; then
            echo "--- Nitro log ---"
            cat /tmp/myskyparcel-nitro.log
            exit 1
          fi

      - name: Stop Nitro server
        if: always()
        run: |
          if [ -f /tmp/myskyparcel-nitro.pid ]; then
            kill "$(cat /tmp/myskyparcel-nitro.pid)" 2>/dev/null || true
          fi

  detect-cpanel:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      configured: ${{ steps.detect.outputs.configured }}
    steps:
      - name: Detect all cPanel deployment secrets
        id: detect
        shell: bash
        env:
          CPANEL_REPO_URL: ${{ secrets.CPANEL_REPO_URL }}
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          CPANEL_KNOWN_HOSTS: ${{ secrets.CPANEL_KNOWN_HOSTS }}
        run: |
          if [ -n "${CPANEL_REPO_URL:-}" ] && [ -n "${CPANEL_SSH_KEY:-}" ] && [ -n "${CPANEL_KNOWN_HOSTS:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "All cPanel deployment secrets are configured."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "cPanel deployment secrets are incomplete; deployment will be skipped."
          fi

  deploy-cpanel:
    needs: [sync-lockfile, build-and-verify, detect-cpanel]
    if: ${{ needs.build-and-verify.result == 'success' && needs.detect-cpanel.outputs.configured == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync-lockfile.outputs.commit_sha }}
          fetch-depth: 0

      - name: Install SSH client
        run: sudo apt-get update -y && sudo apt-get install -y openssh-client

      - name: Configure secure SSH
        shell: bash
        env:
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          CPANEL_KNOWN_HOSTS: ${{ secrets.CPANEL_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$CPANEL_SSH_KEY" > ~/.ssh/cpanel_deploy_key
          chmod 600 ~/.ssh/cpanel_deploy_key
          printf '%s\n' "$CPANEL_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host cpanel-production
            IdentityFile ~/.ssh/cpanel_deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Push verified commit to cPanel Git remote
        env:
          CPANEL_REPO_URL: ${{ secrets.CPANEL_REPO_URL }}
        run: |
          set -euo pipefail
          git remote add cpanel "$CPANEL_REPO_URL"
          GIT_SSH_COMMAND='ssh -F ~/.ssh/config -o HostKeyAlias=cpanel-production' git push cpanel "${{ needs.sync-lockfile.outputs.commit_sha }}:main"

      - name: Deployment handoff complete
        run: echo "Verified commit pushed to the cPanel-managed Git repository."
