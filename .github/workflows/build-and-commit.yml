name: Build and Commit .output

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-commit:
    # Bot-generated commits contain [skip ci], so this job will not run again
    # when the workflow pushes its own build output back to main.
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Commit and push .output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f .output

          if git diff --cached --quiet; then
            echo "No .output changes to commit."
            exit 0
          fi

          git commit -m "build: update .output [skip ci]"
          git push origin HEAD:main
