name: Build and verify MySkyParcel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '.output/**'

permissions:
  contents: write

concurrency:
  group: production-build-main
  cancel-in-progress: false

env:
  NODE_OPTIONS: --max-old-space-size=6144
  NITRO_HOST: 127.0.0.1
  NITRO_PORT: 4173

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: production
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        env:
          NODE_ENV: development
          NPM_CONFIG_PRODUCTION: 'false'
        run: npm ci --include=dev --legacy-peer-deps --no-audit --no-fund

      - name: TypeScript validation
        run: npm run typecheck

      - name: ESLint validation
        run: npm run lint

      - name: Build production application
        env:
          NODE_ENV: production
        run: npm run build:production

      - name: Validate production artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -f .output/server/index.mjs
          test -f .output/nitro.json
          test -d .output/public
          test -f app.js
          test -f public/.htaccess
          find .output/public -type f | grep -E '\.(js|mjs|css|json|svg|woff2?|ttf|otf|wasm)$' >/dev/null

      - name: Start Nitro server
        shell: bash
        run: |
          set -euo pipefail
          node app.js > /tmp/myskyparcel-nitro.log 2>&1 &
          echo $! > /tmp/myskyparcel-nitro.pid
          for attempt in {1..30}; do
            if curl -fsS --max-time 2 http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/myskyparcel-nitro.log
          exit 1

      - name: Smoke test generated application routes
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          routes=(
            /
            /ana-sayfa
            /bildirimler
            /cerez-politikasi
            /dogrula
            /giris
            /gizlilik-politikasi
            /gokyuzu-haritasi
            /guvenlik-ayarlari
            /hakkimizda
            /hediye-kabul
            /hediyelerim
            /iade-iptal-politikasi
            /ile
            /iletisim
            /kayit-ol
            /kullanim-sartlari
            /kvkk
            /mesafeli-satis-sozlesmesi
            /nasil-calisir
            /on-bilgilendirme-formu
            /paketler
            /panelim
            /parsel-hatirasi
            /parsel-satin-al
            /parsellerim
            /pazar-yeri
            /profilim
            /purchase
            /purchase-bulk
            /sertifika-dogrula
            /sertifika-talep
            /sertifikalarim
            /sifre-yenile
            /sifremi-unuttum
            /siparislerim
            /turkiye-haritasi
            /uyelik-sozlesmesi
            /yonetim
          )
          for route in "${routes[@]}"; do
            code="$(curl -sS -o /tmp/route-response -w '%{http_code}' --max-time 20 "http://127.0.0.1:4173${route}")" || code="000"
            case "$code" in
              2*|3*) echo "PASS $code $route" ;;
              *) echo "FAIL $code $route"; failed=$((failed+1)) ;;
            esac
          done

          for city in istanbul gaziantep; do
            route="/sehir/${city}"
            code="$(curl -sS -o /tmp/route-response -w '%{http_code}' --max-time 20 "http://127.0.0.1:4173${route}")" || code="000"
            case "$code" in
              2*|3*) echo "PASS $code $route" ;;
              *) echo "FAIL $code $route"; failed=$((failed+1));; esac
          done

          code="$(curl -sS -o /tmp/route-response -w '%{http_code}' --max-time 20 'http://127.0.0.1:4173/api/earth-assets?type=provinces')" || code="000"
          case "$code" in 200) echo "PASS $code /api/earth-assets";; *) echo "FAIL $code /api/earth-assets"; failed=$((failed+1));; esac

          code="$(curl -sS -o /tmp/route-response -w '%{http_code}' --max-time 20 'http://127.0.0.1:4173/admin-check')" || code="000"
          case "$code" in 401|403) echo "PASS $code /admin-check-auth";; *) echo "FAIL $code /admin-check-auth"; failed=$((failed+1));; esac

          if [ "$failed" -ne 0 ]; then
            cat /tmp/myskyparcel-nitro.log
            exit 1
          fi

      - name: Commit prebuilt Nitro output for cPanel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .output
          if git diff --cached --quiet -- .output; then
            echo "Production output unchanged."
            exit 0
          fi
          git commit -m "build: update prebuilt production output"
          git push origin HEAD:main

      - name: Stop Nitro server
        if: always()
        run: |
          if [ -f /tmp/myskyparcel-nitro.pid ]; then kill "$(cat /tmp/myskyparcel-nitro.pid)" 2>/dev/null || true; fi
