name: Build, verify and deploy MySkyParcel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy-main
  cancel-in-progress: false

env:
  NODE_OPTIONS: --max-old-space-size=6144
  NITRO_HOST: 127.0.0.1
  NITRO_PORT: 4173

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: production

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install all dependencies required for build
        env:
          NODE_ENV: development
          NPM_CONFIG_PRODUCTION: 'false'
        run: npm ci --include=dev --legacy-peer-deps --no-audit --no-fund

      - name: Build production Nitro application
        env:
          NODE_ENV: production
        run: npm run build:production

      - name: Validate production build
        shell: bash
        run: |
          set -euo pipefail
          test -f .output/server/index.mjs
          test -f .output/nitro.json
          test -d .output/public
          test -f app.js
          echo "Production build artifacts are present."

      - name: Validate frontend assets and MIME-safe files
        shell: bash
        run: |
          set -euo pipefail
          test -f public/.htaccess
          find .output/public -type f | grep -E '\.(js|mjs|css|json|svg|woff2?|ttf|otf|wasm)$' >/dev/null
          echo "Frontend asset output is present."

      - name: Start Nitro server for route smoke tests
        shell: bash
        run: |
          set -euo pipefail
          node app.js > /tmp/myskyparcel-nitro.log 2>&1 &
          echo $! > /tmp/myskyparcel-nitro.pid

          for attempt in {1..30}; do
            if curl -fsS --max-time 2 http://127.0.0.1:4173/ >/dev/null; then
              echo "Nitro server is ready."
              exit 0
            fi
            sleep 1
          done

          cat /tmp/myskyparcel-nitro.log
          exit 1

      - name: Smoke test every generated static route
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t routes < <(
            grep -oE "path: '[^']+'" src/routeTree.gen.ts \
              | sed -E "s/^path: '([^']+)'$/\1/" \
              | grep -v '\$' \
              | sort -u
          )

          failed=0
          tested=0

          for route in "${routes[@]}"; do
            tested=$((tested + 1))
            code="$(curl -sS -o /tmp/route-response -w '%{http_code}' --max-time 20 "http://127.0.0.1:4173${route}")" || code="000"

            case "$code" in
              2*|3*) echo "PASS $code $route" ;;
              *) echo "FAIL $code $route"; failed=$((failed + 1)) ;;
            esac
          done

          for route in /iletisim /yonetim /sehir/istanbul /sehir/gaziantep /api/earth-assets; do
            tested=$((tested + 1))
            code="$(curl -sS -o /tmp/route-response -w '%{http_code}' --max-time 20 "http://127.0.0.1:4173${route}")" || code="000"
            case "$code" in
              2*|3*) echo "PASS $code $route" ;;
              *) echo "FAIL $code $route"; failed=$((failed + 1)) ;;
            esac
          done

          echo "Tested $tested routes; failures: $failed"

          if [ "$failed" -ne 0 ]; then
            echo "--- Nitro log ---"
            cat /tmp/myskyparcel-nitro.log
            exit 1
          fi

      - name: Stop Nitro smoke-test server
        if: always()
        run: |
          if [ -f /tmp/myskyparcel-nitro.pid ]; then
            kill "$(cat /tmp/myskyparcel-nitro.pid)" 2>/dev/null || true
          fi

  detect-cpanel:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      configured: ${{ steps.detect.outputs.configured }}
    steps:
      - name: Detect cPanel deployment secrets
        id: detect
        shell: bash
        env:
          CPANEL_REPO_URL: ${{ secrets.CPANEL_REPO_URL }}
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
        run: |
          if [ -n "${CPANEL_REPO_URL:-}" ] && [ -n "${CPANEL_SSH_KEY:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "cPanel deployment secrets are not configured; cPanel deployment will be skipped."
          fi

  deploy-cpanel:
    needs: [build-and-verify, detect-cpanel]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ needs.build-and-verify.result == 'success' && needs.detect-cpanel.outputs.configured == 'true' }}

    steps:
      - name: Checkout exact commit that passed verification
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install SSH client
        run: sudo apt-get update -y && sudo apt-get install -y openssh-client

      - name: Configure SSH for cPanel Git repository
        shell: bash
        env:
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          CPANEL_KNOWN_HOSTS: ${{ secrets.CPANEL_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$CPANEL_SSH_KEY" > ~/.ssh/cpanel_deploy_key
          chmod 600 ~/.ssh/cpanel_deploy_key

          if [ -z "${CPANEL_KNOWN_HOSTS:-}" ]; then
            echo "CPANEL_KNOWN_HOSTS is required for secure SSH deployment."
            exit 1
          fi

          printf '%s\n' "$CPANEL_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          cat > ~/.ssh/config <<'EOF'
          Host cpanel-production
            IdentityFile ~/.ssh/cpanel_deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Push verified commit to cPanel repository
        env:
          CPANEL_REPO_URL: ${{ secrets.CPANEL_REPO_URL }}
        run: |
          set -euo pipefail
          git remote add cpanel "$CPANEL_REPO_URL"
          GIT_SSH_COMMAND='ssh -F ~/.ssh/config -o HostKeyAlias=cpanel-production' git push cpanel HEAD:main

      - name: Deployment handoff complete
        run: echo "Verified main commit pushed to the cPanel-managed Git repository; cPanel post-receive deployment should now run .cpanel.yml."
