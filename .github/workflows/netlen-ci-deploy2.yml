name: Netlen CI Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: netlen-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production application
        run: npm run build
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}

      - name: Verify production output
        run: |
          set -euo pipefail
          test -f .output/server/index.mjs
          test -f .output/nitro.json
          test -f app.js
          test -f .cpanel.yml

      - name: Publish deployment payload
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          deploy_tmp="$RUNNER_TEMP/netlen-deploy"
          rm -rf "$deploy_tmp"
          mkdir -p "$deploy_tmp"
          cp -R .output "$deploy_tmp/.output"
          cp app.js "$deploy_tmp/app.js"
          cp .cpanel.yml "$deploy_tmp/.cpanel.yml"

          git fetch origin netlen-deploy
          git switch --detach "origin/netlen-deploy"
          git clean -fdx
          git rm -rf . || true

          cp -R "$deploy_tmp/.output" .output
          cp "$deploy_tmp/app.js" app.js
          cp "$deploy_tmp/.cpanel.yml" .cpanel.yml
          git add .output app.js .cpanel.yml
          git commit -m "deploy: build $GITHUB_SHA"
          git push origin HEAD:netlen-deploy

      - name: Update cPanel repository
        env:
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        run: |
          set -euo pipefail
          base="https://jupiter.netlen.com.tr:2083"
          auth="Authorization: cpanel myskypar:${CPANEL_API_TOKEN}"
          repo="/home/myskypar/repositories/pixel-perfect-clone-14793"
          curl --fail-with-body --silent --show-error \
            --header "$auth" --get \
            --data-urlencode "repository_root=$repo" \
            --data-urlencode "branch=netlen-deploy" \
            "$base/execute/VersionControl/update"

      - name: Trigger cPanel deployment
        env:
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        run: |
          set -euo pipefail
          base="https://jupiter.netlen.com.tr:2083"
          auth="Authorization: cpanel myskypar:${CPANEL_API_TOKEN}"
          repo="/home/myskypar/repositories/pixel-perfect-clone-14793"
          curl --fail-with-body --silent --show-error \
            --header "$auth" --get \
            --data-urlencode "repository_root=$repo" \
            "$base/execute/VersionControlDeployment/create"
