name: Netlen CI Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # npm install intentionally regenerates package-lock.json from package.json.
      - run: npm install

      - name: Persist npm-generated lockfile
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json
          git commit -m "chore(deps): sync package-lock with package.json [skip ci]"
          git push origin HEAD:main

      - run: npm run build
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}

      - name: Verify generated deployment
        run: test -f .output/server/index.mjs && test -f .output/nitro.json && test -f app.js

      - name: Publish generated deployment branch
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          # Preserve build output before replacing the Git worktree.
          deploy_tmp="$RUNNER_TEMP/netlen-deploy"
          rm -rf "$deploy_tmp"
          mkdir -p "$deploy_tmp"
          cp -R "$GITHUB_WORKSPACE/.output" "$deploy_tmp/.output"
          cp "$GITHUB_WORKSPACE/app.js" "$deploy_tmp/app.js"
          cp "$GITHUB_WORKSPACE/.cpanel.yml" "$deploy_tmp/.cpanel.yml"

          # Clean generated/untracked files first so orphan checkout cannot fail.
          git reset --hard HEAD
          git clean -fdx
          git switch --orphan netlen-deploy
          git rm -rf . || true

          cp -R "$deploy_tmp/.output" .output
          cp "$deploy_tmp/app.js" app.js
          cp "$deploy_tmp/.cpanel.yml" .cpanel.yml
          git add .output app.js .cpanel.yml
          git commit -m "deploy: build $GITHUB_SHA"
          git push --force origin HEAD:netlen-deploy

      - name: Update cPanel to generated deployment branch
        env:
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        run: |
          set -euo pipefail
          base="https://jupiter.netlen.com.tr:2083"
          auth="Authorization: cpanel myskypar:${CPANEL_API_TOKEN}"
          repo="/home/myskypar/repositories/pixel-perfect-clone-14793"
          curl --fail-with-body --silent --show-error \
            --header "$auth" --get \
            --data-urlencode "repository_root=$repo" \
            --data-urlencode "branch=netlen-deploy" \
            "$base/execute/VersionControl/update"

      - name: Deploy generated build to public_html
        env:
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        run: |
          set -euo pipefail
          base="https://jupiter.netlen.com.tr:2083"
          auth="Authorization: cpanel myskypar:${CPANEL_API_TOKEN}"
          repo="/home/myskypar/repositories/pixel-perfect-clone-14793"
          curl --fail-with-body --silent --show-error \
            --header "$auth" --get \
            --data-urlencode "repository_root=$repo" \
            "$base/execute/VersionControlDeployment/create"
