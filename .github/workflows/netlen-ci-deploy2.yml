name: Netlen CI Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlen-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and Deploy to Netlen cPanel
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production application
        run: npm run build
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}

      - name: Verify production output
        run: |
          set -euo pipefail
          test -f .output/server/index.mjs
          test -f .output/nitro.json
          test -d .output/public
          test -f app.js
          test -f .cpanel.yml
          du -sh .output

      - name: Validate cPanel push secrets
        env:
          CPANEL_GIT_SSH_URL: ${{ secrets.CPANEL_GIT_SSH_URL }}
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${CPANEL_GIT_SSH_URL:-}" || { echo "ERROR: CPANEL_GIT_SSH_URL is not configured."; exit 1; }
          test -n "${CPANEL_SSH_PRIVATE_KEY:-}" || { echo "ERROR: CPANEL_SSH_PRIVATE_KEY is not configured."; exit 1; }
          test -n "${CPANEL_SSH_KNOWN_HOSTS:-}" || { echo "ERROR: CPANEL_SSH_KNOWN_HOSTS is not configured."; exit 1; }
          echo "cPanel SSH deployment secrets are configured."

      - name: Configure SSH for Netlen cPanel
        env:
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$CPANEL_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Prepare deployment commit from current cPanel branch
        env:
          CPANEL_GIT_SSH_URL: ${{ secrets.CPANEL_GIT_SSH_URL }}
        run: |
          set -euo pipefail
          deploy_branch="netlen-deploy"
          worktree="$RUNNER_TEMP/cpanel-deploy-worktree"
          rm -rf "$worktree"

          git remote remove cpanel 2>/dev/null || true
          git remote add cpanel "$CPANEL_GIT_SSH_URL"

          remote_sha="$(git ls-remote "$CPANEL_GIT_SSH_URL" "refs/heads/${deploy_branch}" | awk '{print $1}')"
          test -n "$remote_sha" || {
            echo "ERROR: cPanel remote does not expose refs/heads/${deploy_branch}."
            exit 1
          }
          echo "cPanel ${deploy_branch} before push: ${remote_sha}"

          git fetch cpanel "refs/heads/${deploy_branch}"
          git worktree add --detach "$worktree" "FETCH_HEAD"
          trap 'git worktree remove --force "$worktree" || true' EXIT

          rm -rf "$worktree/.output"
          cp -R .output "$worktree/.output"
          cp app.js "$worktree/app.js"
          cp .cpanel.yml "$worktree/.cpanel.yml"

          cd "$worktree"
          git add -A .output app.js .cpanel.yml
          if git diff --cached --quiet; then
            echo "No production payload changes to deploy."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "deploy: production $GITHUB_SHA"
          production_sha="$(git rev-parse HEAD)"
          echo "Prepared cPanel deployment commit: ${production_sha}"
          echo "PRODUCTION_SHA=${production_sha}" >> "$GITHUB_ENV"
          echo "DEPLOY_WORKTREE=${worktree}" >> "$GITHUB_ENV"

      - name: Push production commit directly to cPanel Git
        env:
          CPANEL_GIT_SSH_URL: ${{ secrets.CPANEL_GIT_SSH_URL }}
        run: |
          set -euo pipefail
          test -n "${PRODUCTION_SHA:-}" || {
            echo "No new deployment commit was created; deployment is already current."
            exit 0
          }

          cd "$DEPLOY_WORKTREE"
          git push cpanel "${PRODUCTION_SHA}:refs/heads/netlen-deploy"

          verified_sha="$(git ls-remote "$CPANEL_GIT_SSH_URL" refs/heads/netlen-deploy | awk '{print $1}')"
          test "$verified_sha" = "$PRODUCTION_SHA" || {
            echo "ERROR: cPanel branch verification failed."
            echo "Expected: $PRODUCTION_SHA"
            echo "Actual:   $verified_sha"
            exit 1
          }
          echo "cPanel netlen-deploy now points to ${verified_sha}."
          echo "The cPanel post-receive hook is responsible for running .cpanel.yml."
