name: Netlen CI Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlen-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and Deploy to Netlen cPanel
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production application
        run: npm run build
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}

      - name: Verify production output
        run: |
          set -euo pipefail
          test -f .output/server/index.mjs
          test -f .output/nitro.json
          test -d .output/public
          test -f app.js
          test -f .cpanel.yml
          du -sh .output

      - name: Validate cPanel SSH secret
        env:
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${CPANEL_SSH_PRIVATE_KEY:-}" || {
            echo "ERROR: CPANEL_SSH_PRIVATE_KEY is not configured."
            exit 1
          }
          echo "cPanel SSH deployment key is configured."

      - name: Configure SSH for Netlen cPanel
        env:
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 22 -H jupiter.netlen.com.tr >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Prepare deployment commit from current cPanel branch
        run: |
          set -euo pipefail
          deploy_branch="netlen-deploy"
          cpanel_remote="ssh://myskypar@jupiter.netlen.com.tr:22/home/myskypar/repositories/pixel-perfect-clone-14793"
          worktree="$RUNNER_TEMP/cpanel-deploy-worktree"
          rm -rf "$worktree"

          git remote remove cpanel 2>/dev/null || true
          git remote add cpanel "$cpanel_remote"

          remote_sha="$(git ls-remote "$cpanel_remote" "refs/heads/${deploy_branch}" | awk '{print $1}')"
          test -n "$remote_sha" || {
            echo "ERROR: cPanel repository does not expose refs/heads/${deploy_branch}."
            exit 1
          }
          echo "cPanel ${deploy_branch} before push: ${remote_sha}"

          git fetch cpanel "refs/heads/${deploy_branch}"
          git worktree add --detach "$worktree" "FETCH_HEAD"
          trap 'git worktree remove --force "$worktree" || true' EXIT

          rm -rf "$worktree/.output"
          cp -R .output "$worktree/.output"
          cp app.js "$worktree/app.js"
          cp .cpanel.yml "$worktree/.cpanel.yml"

          cd "$worktree"
          git add -A .output app.js .cpanel.yml
          if git diff --cached --quiet; then
            echo "No production payload changes to deploy."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "deploy: production $GITHUB_SHA"
          production_sha="$(git rev-parse HEAD)"
          echo "Prepared cPanel deployment commit: ${production_sha}"
          echo "PRODUCTION_SHA=${production_sha}" >> "$GITHUB_ENV"
          echo "DEPLOY_WORKTREE=${worktree}" >> "$GITHUB_ENV"
          echo "CPANEL_REMOTE=${cpanel_remote}" >> "$GITHUB_ENV"

      - name: Push production commit directly to existing cPanel Git
        run: |
          set -euo pipefail
          test -n "${PRODUCTION_SHA:-}" || {
            echo "No new deployment commit was created; deployment is already current."
            exit 0
          }

          cd "$DEPLOY_WORKTREE"
          git push "$CPANEL_REMOTE" "${PRODUCTION_SHA}:refs/heads/netlen-deploy"

          verified_sha="$(git ls-remote "$CPANEL_REMOTE" refs/heads/netlen-deploy | awk '{print $1}')"
          test "$verified_sha" = "$PRODUCTION_SHA" || {
            echo "ERROR: cPanel branch verification failed."
            echo "Expected: $PRODUCTION_SHA"
            echo "Actual:   $verified_sha"
            exit 1
          }
          echo "cPanel netlen-deploy now points to ${verified_sha}."
          echo "Direct SSH push completed; cPanel post-receive hook should run .cpanel.yml automatically."

      - name: Verify cPanel deployment state
        env:
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${CPANEL_API_TOKEN:-}" || {
            echo "ERROR: CPANEL_API_TOKEN is not configured."
            exit 1
          }
          response="$(curl --fail-with-body -sS \
            -u "myskypar:${CPANEL_API_TOKEN}" \
            "https://jupiter.netlen.com.tr:2083/execute/VersionControlDeployment/retrieve")"
          printf '%s\n' "$response" > "$RUNNER_TEMP/cpanel-deployment.json"
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path("/home/runner/work/_temp/cpanel-deployment.json")
          data = json.loads(p.read_text())
          if data.get("result", {}).get("status") != 1:
              raise SystemExit("cPanel deployment status API returned failure")
          print("cPanel deployment status API responded successfully.")
          print(json.dumps(data.get("result", {}).get("data"), indent=2)[:12000])
          PY
