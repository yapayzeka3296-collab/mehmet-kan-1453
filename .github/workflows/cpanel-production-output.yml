name: Build cPanel production output

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cpanel-production-output
  cancel-in-progress: true

jobs:
  build-output:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Regenerate TanStack route tree
        run: npx tsr generate

      - name: Verify generated route tree
        run: |
          grep -q "'/kvkk'" src/routeTree.gen.ts
          grep -q "'/odeme'" src/routeTree.gen.ts
          grep -q "'/parsel-hatirasi'" src/routeTree.gen.ts
          grep -q "'/pazar-yeri'" src/routeTree.gen.ts
          grep -q "'/turkiye-haritasi'" src/routeTree.gen.ts
          echo "TanStack route tree contains the required application routes."

      - name: Build production output
        run: npm run build

      - name: Verify production route output
        run: |
          test -f .output/server/index.mjs
          test -d .output/server
          test -f .output/server/_tanstack-start-manifest_v-*.mjs
          grep -R -q "giris" .output/server
          grep -R -q "gokyuzu-haritasi" .output/server
          grep -R -q "odeme" .output/server
          grep -R -q "kvkk" .output/server
          grep -R -q "parsel-hatirasi" .output/server
          grep -R -q "pazar-yeri" .output/server
          grep -R -q "turkiye-haritasi" .output/server
          echo "Production Nitro output contains the expected application routes."

      - name: Publish generated output to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .output
          if git diff --cached --quiet; then
            echo "No .output changes to publish."
            exit 0
          fi
          git commit -m "chore: update cPanel production output"
          git push origin HEAD:main
