name: One-time fix memory audio

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize memory audio code
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('src/components/ParcelDetailPanel.tsx')
          s=p.read_text(encoding='utf-8')
          pattern=r"(const memoryPlaybackPromiseRef = useRef<Promise<void> \| null>\(null\);)(?:\s*\1)+"
          s=re.sub(pattern, r"\1", s)
          p.write_text(s,encoding='utf-8')
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ParcelDetailPanel.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: normalize memory playback ref [skip ci]"
          git push
