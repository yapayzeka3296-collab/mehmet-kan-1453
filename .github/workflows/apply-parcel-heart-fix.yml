name: Apply parcel heart fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[parcel-heart-fix]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply UI change
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/CityParcelLivePage.tsx')
          text = path.read_text(encoding='utf-8')
          old_class = 'className="relative z-[110] block h-full w-full min-h-0 min-w-0 cursor-pointer'
          new_class = 'className="group relative z-[110] block h-full w-full min-h-0 min-w-0 cursor-pointer'
          old_heart = '<span className="pointer-events-none absolute -right-1.5 -top-1.5 z-[140] text-[10px] leading-none drop-shadow-[0_0_5px_rgba(255,166,90,.9)]">🧡</span>'
          new_heart = '<span className="pointer-events-none absolute left-1/2 top-1/2 z-[145] -translate-x-1/2 -translate-y-1/2 drop-shadow-[0_0_10px_rgba(255,96,96,.95)]"><Heart className="h-5 w-5 fill-red-400 text-red-100 sm:h-7 sm:w-7" /></span><span className="pointer-events-none absolute bottom-full left-1/2 z-[150] mb-1 -translate-x-1/2 whitespace-nowrap rounded-md border border-red-300/40 bg-slate-950/95 px-2 py-1 text-[8px] font-bold text-red-100 opacity-0 shadow-lg transition-opacity duration-150 group-hover:opacity-100 sm:text-[9px]">HATIRAYI GÖR</span>'
          if old_class not in text:
              raise SystemExit('Expected parcel button class was not found; no changes made.')
          if old_heart not in text:
              raise SystemExit('Expected old parcel heart marker was not found; no changes made.')
          text = text.replace(old_class, new_class, 1)
          text = text.replace(old_heart, new_heart, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit source change and remove temporary workflow
        run: |
          rm -f .github/workflows/apply-parcel-heart-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/CityParcelLivePage.tsx .github/workflows/apply-parcel-heart-fix.yml
          git commit -m "feat: improve sold parcel memory marker [parcel-heart-fix]"
          git push origin HEAD:main
