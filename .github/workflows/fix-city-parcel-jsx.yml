name: Fix City Parcel JSX

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair sky map source without changing routes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/components/CityParcelLivePage.tsx')
          text = path.read_text()

          # The previous automated memory patch removed the state/handler but
          # left the old fixed notification JSX behind. That makes the sky-map
          # component fail to compile because memoryNotice/openMemory are gone.
          text = re.sub(
              r'\{memoryNotice && <div className="fixed right-4 top-20.*?</div></div></div>\}',
              '',
              text,
              count=1,
              flags=re.S,
          )

          # X is still used by the parcel-list remove button.
          text = text.replace(
              'import { ArrowLeft, Heart, MapPin, ShoppingCart } from "lucide-react";',
              'import { ArrowLeft, Heart, MapPin, ShoppingCart, X } from "lucide-react";',
          )

          # Show the small memory tooltip only on parcels that actually have a public memory.
          text = text.replace(
              '<span className="pointer-events-none absolute bottom-full left-1/2 z-[300] mb-1 -translate-x-1/2 whitespace-nowrap rounded-md border border-orange-300/30 bg-[#071a2d]/95 px-2 py-1 text-[9px] font-bold text-orange-100 opacity-0 shadow-lg backdrop-blur-sm transition-opacity duration-150 group-hover:opacity-100">HATIRAYI GÖR</span>',
              '{hasMemory && <span className="pointer-events-none absolute bottom-full left-1/2 z-[300] mb-1 -translate-x-1/2 whitespace-nowrap rounded-md border border-orange-300/30 bg-[#071a2d]/95 px-2 py-1 text-[9px] font-bold text-orange-100 opacity-0 shadow-lg backdrop-blur-sm transition-opacity duration-150 group-hover:opacity-100">HATIRAYI GÖR</span>}',
          )

          if 'memoryNotice && <div className="fixed' in text:
              raise SystemExit('Stale memoryNotice JSX remains')
          if 'onClick={openMemory}' in text:
              raise SystemExit('Stale openMemory handler remains')

          path.write_text(text)
          PY

      - name: Build production output
        run: |
          npm ci
          npm run build

      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/CityParcelLivePage.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: restore sky map rendering"
          git push origin HEAD:main
