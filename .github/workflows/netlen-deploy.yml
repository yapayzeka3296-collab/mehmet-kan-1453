name: Netlen cPanel Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger cPanel Git deployment
        env:
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error \
            --header "Authorization: cpanel myskypar:${CPANEL_API_TOKEN}" \
            --get \
            --data-urlencode "repository_root=/home/myskypar/repositories/pixel-perfect-clone-14793" \
            "https://jupiter.netlen.com.tr:2083/execute/VersionControlDeployment/create")
          printf '%s\n' "$response"
