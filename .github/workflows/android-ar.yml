name: MySkyParcel AR Android Build

on:
  push:
    branches: ["ar-complete"]
  pull_request:
    paths:
      - "android-ar/**"
      - ".github/workflows/android-ar.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-ar
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug -PARCORE_API_KEY="${{ secrets.ARCORE_API_KEY || secrets.VITE_GOOGLE_MAPS_API_KEY }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: myskyparcel-ar-debug
          path: android-ar/app/build/outputs/apk/debug/app-debug.apk
