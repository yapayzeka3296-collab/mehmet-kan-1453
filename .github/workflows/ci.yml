name: CI

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: netlen-production
  cancel-in-progress: false

jobs:
  validate:
    name: Lint, TypeScript and Build
    if: >-
      github.event_name != 'pull_request' ||
      github.event.action != 'closed' ||
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merged == true && 'main' || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Resolve Google Maps production key
        env:
          GOOGLE_MAPS_SECRET: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          GOOGLE_MAPS_VARIABLE: ${{ vars.VITE_GOOGLE_MAPS_API_KEY }}
        run: |
          set -euo pipefail
          key="${GOOGLE_MAPS_SECRET:-}"
          source="repository secret"
          if [ -z "$key" ]; then
            key="${GOOGLE_MAPS_VARIABLE:-}"
            source="repository variable"
          fi
          if [ -z "$key" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.action }}" != "closed" ]; then
              key="ci-placeholder-google-maps-key"
              source="non-production PR placeholder"
            else
              echo "ERROR: VITE_GOOGLE_MAPS_API_KEY is not available to this production workflow. Configure it under GitHub Settings > Secrets and variables > Actions as a repository secret (preferred)."
              exit 1
            fi
          fi
          if [ "${#key}" -lt 20 ]; then
            echo "ERROR: VITE_GOOGLE_MAPS_API_KEY is present but unexpectedly short."
            exit 1
          fi
          {
            echo 'VITE_GOOGLE_MAPS_API_KEY<<__GOOGLE_MAPS_KEY__'
            printf '%s\n' "$key"
            echo '__GOOGLE_MAPS_KEY__'
          } >> "$GITHUB_ENV"
          echo "Google Maps production key resolved from $source."

      - name: Production build with memory measurement
        run: |
          set -euo pipefail
          /usr/bin/time -v -o build-resource-usage.txt npm run build
          cat build-resource-usage.txt

      - name: Inspect build output
        run: |
          set -euo pipefail
          test -f .output/server/index.mjs
          test -f .output/nitro.json
          test -d .output/public
          test -f app.js
          test -f .cpanel.yml
          du -sh .output

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Upload production deployment payload
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
        uses: actions/upload-artifact@v4
        with:
          name: myskyparcel-production-${{ github.sha }}
          include-hidden-files: true
          path: |
            .output/**
            app.js
            .cpanel.yml
          if-no-files-found: error
          retention-days: 7

  deploy-netlen:
    name: Deploy production payload to Netlen cPanel Git
    needs: validate
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download production deployment payload
        uses: actions/download-artifact@v4
        with:
          name: myskyparcel-production-${{ github.sha }}
          path: deploy-payload

      - name: Validate cPanel deployment secrets
        env:
          CPANEL_GIT_SSH_URL: ${{ secrets.CPANEL_GIT_SSH_URL }}
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${CPANEL_GIT_SSH_URL:-}" || { echo "ERROR: CPANEL_GIT_SSH_URL is not configured."; exit 1; }
          test -n "${CPANEL_SSH_PRIVATE_KEY:-}" || { echo "ERROR: CPANEL_SSH_PRIVATE_KEY is not configured."; exit 1; }
          test -n "${CPANEL_SSH_KNOWN_HOSTS:-}" || { echo "ERROR: CPANEL_SSH_KNOWN_HOSTS is not configured."; exit 1; }

      - name: Configure SSH for Netlen cPanel
        env:
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$CPANEL_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Prepare clean cPanel deployment repository
        env:
          CPANEL_GIT_SSH_URL: ${{ secrets.CPANEL_GIT_SSH_URL }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code "$CPANEL_GIT_SSH_URL" refs/heads/main >/dev/null 2>&1; then
            git clone --branch main --single-branch "$CPANEL_GIT_SSH_URL" cpanel-deploy
          else
            mkdir cpanel-deploy
            cd cpanel-deploy
            git init -b main
            git remote add origin "$CPANEL_GIT_SSH_URL"
          fi

          cd cpanel-deploy
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R ../deploy-payload/.output .output
          cp ../deploy-payload/app.js app.js
          cp ../deploy-payload/.cpanel.yml .cpanel.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add -A
          git commit -m "deploy: MySkyParcel ${GITHUB_SHA}"

      - name: Push production payload to Netlen cPanel Git
        working-directory: cpanel-deploy
        env:
          CPANEL_GIT_SSH_URL: ${{ secrets.CPANEL_GIT_SSH_URL }}
        run: |
          set -euo pipefail
          git push origin HEAD:main
          deployed_sha="$(git ls-remote "$CPANEL_GIT_SSH_URL" refs/heads/main | awk '{print $1}')"
          test -n "$deployed_sha"
          echo "Netlen cPanel repository accepted deployment commit: $deployed_sha"

      - name: Verify deployment payload
        run: |
          set -euo pipefail
          test -f deploy-payload/.cpanel.yml
          test -f deploy-payload/app.js
          test -f deploy-payload/.output/server/index.mjs
          test -f deploy-payload/.output/nitro.json
          echo "Production payload verified and handed to cPanel push deployment."
