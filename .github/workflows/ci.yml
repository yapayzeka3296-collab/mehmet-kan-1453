# MySkyParcel production deployment: GitHub Actions -> Netlen cPanel-managed Git -> .cpanel.yml
name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - '.output/**'

permissions:
  contents: write

concurrency:
  group: netlen-production
  cancel-in-progress: false

jobs:
  validate:
    name: Lint, TypeScript and Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Production build with memory measurement
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: |
          set -euo pipefail
          echo "Starting MySkyParcel production build with resource measurement..."
          /usr/bin/time -v -o build-resource-usage.txt npm run build
          echo "=== Build resource usage ==="
          cat build-resource-usage.txt

      - name: Inspect build output
        run: |
          set -euo pipefail
          test -f .output/server/index.mjs
          test -f .output/nitro.json
          test -d .output/public
          test -f app.js
          test -f .cpanel.yml
          echo "Production server entry exists: .output/server/index.mjs"
          echo "Nitro metadata exists: .output/nitro.json"
          echo "Production public directory exists: .output/public"
          echo "Passenger entry exists: app.js"
          echo "cPanel deployment manifest exists: .cpanel.yml"
          du -sh .output

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Commit production build for cPanel
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .output
          if git diff --cached --quiet; then
            echo "Production build is already up to date."
          else
            git commit -m "chore: update Netlen production build [skip ci]"
            git push origin HEAD:main
          fi
          echo "Production deployment commit: $(git rev-parse HEAD)"

  deploy-netlen:
    name: Push exact production commit to Netlen cPanel Git
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch the production commit created by validate
        run: |
          set -euo pipefail
          git fetch origin main --force
          git checkout --detach origin/main
          production_sha="$(git rev-parse HEAD)"
          echo "Production commit selected for Netlen: ${production_sha}"
          test -f .output/server/index.mjs
          test -f .output/nitro.json
          test -f app.js
          test -f .cpanel.yml

      - name: Validate cPanel deployment secrets
        env:
          CPANEL_GIT_SSH_URL: ${{ secrets.CPANEL_GIT_SSH_URL }}
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${CPANEL_GIT_SSH_URL:-}" || { echo "ERROR: CPANEL_GIT_SSH_URL is not configured."; exit 1; }
          test -n "${CPANEL_SSH_PRIVATE_KEY:-}" || { echo "ERROR: CPANEL_SSH_PRIVATE_KEY is not configured."; exit 1; }
          test -n "${CPANEL_SSH_KNOWN_HOSTS:-}" || { echo "ERROR: CPANEL_SSH_KNOWN_HOSTS is not configured."; exit 1; }
          echo "cPanel deployment secrets are configured."

      - name: Configure SSH for Netlen cPanel
        env:
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$CPANEL_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Verify Netlen cPanel remote and push exact production commit
        env:
          CPANEL_GIT_SSH_URL: ${{ secrets.CPANEL_GIT_SSH_URL }}
        run: |
          set -euo pipefail
          git remote remove cpanel 2>/dev/null || true
          git remote add cpanel "$CPANEL_GIT_SSH_URL"
          production_sha="$(git rev-parse HEAD)"
          echo "Netlen remote: ${CPANEL_GIT_SSH_URL%@*}@***"
          remote_main_sha="$(git ls-remote "$CPANEL_GIT_SSH_URL" refs/heads/main | awk '{print $1}')"
          echo "Netlen main before push: ${remote_main_sha:-<unavailable>}"
          echo "GitHub production commit: ${production_sha}"
          git push cpanel "${production_sha}:refs/heads/main"
          verified_remote_sha="$(git ls-remote "$CPANEL_GIT_SSH_URL" refs/heads/main | awk '{print $1}')"
          test "$verified_remote_sha" = "$production_sha"
          echo "Netlen cPanel repository now points to production commit: ${verified_remote_sha}"
          echo "cPanel's post-receive hook is now responsible for executing .cpanel.yml."
