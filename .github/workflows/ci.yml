name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    name: Lint, TypeScript and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Refresh compatible security fixes
        run: npm audit fix --package-lock-only

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json package.json; then
            echo "No dependency changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json
          git commit -m "chore: refresh audited dependencies"
          git push

      - name: Production build
        run: npm run build

      - name: Inspect build output
        run: |
          echo "Build output directories:"
          find . -maxdepth 3 -type d \( -name '.output' -o -name 'dist' -o -name 'build' \) -print
          echo "Top-level files/directories:"
          ls -la

      - name: Prepare production build artifact
        run: |
          set -e
          rm -rf production-build
          if [ -d ".output" ]; then
            cp -R .output production-build
          elif [ -d "dist" ]; then
            cp -R dist production-build
          elif [ -d "build" ]; then
            cp -R build production-build
          else
            echo "No supported production build directory was found."
            exit 1
          fi
          echo "Prepared artifact:"
          find production-build -maxdepth 3 -type f -print | head -200

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: myskyparcel-production-build
          path: production-build/
          if-no-files-found: error
          retention-days: 7

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint
