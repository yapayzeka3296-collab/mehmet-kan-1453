name: CI

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: netlen-production
  cancel-in-progress: false

env:
  NETLEN_DEPLOY_PATH: /home/myskypar/public_html
  NETLEN_SSH_PORT: '22'

jobs:
  validate:
    name: Lint, TypeScript and Build
    if: >-
      github.event_name != 'pull_request' ||
      github.event.action != 'closed' ||
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merged == true && 'main' || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Production build with memory measurement
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: |
          set -euo pipefail
          /usr/bin/time -v -o build-resource-usage.txt npm run build
          cat build-resource-usage.txt

      - name: Inspect build output
        run: |
          set -euo pipefail
          test -f .output/server/index.mjs
          test -f .output/nitro.json
          test -d .output/public
          test -f app.js
          du -sh .output

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Upload production deployment payload
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
        uses: actions/upload-artifact@v4
        with:
          name: myskyparcel-production-${{ github.sha }}
          include-hidden-files: true
          path: |
            .output/**
            app.js
          if-no-files-found: error
          retention-days: 7

  deploy-netlen:
    name: Deploy production to Netlen via SSH
    needs: validate
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production

    steps:
      - name: Download production deployment payload
        uses: actions/download-artifact@v4
        with:
          name: myskyparcel-production-${{ github.sha }}
          path: deploy-payload

      - name: Validate Netlen SSH configuration
        env:
          NETLEN_SSH_HOST: ${{ vars.NETLEN_SSH_HOST }}
          NETLEN_SSH_USER: ${{ vars.NETLEN_SSH_USER }}
          NETLEN_SSH_PRIVATE_KEY: ${{ secrets.NETLEN_SSH_PRIVATE_KEY }}
          NETLEN_SSH_KNOWN_HOSTS: ${{ secrets.NETLEN_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${NETLEN_SSH_HOST:-}" || { echo "ERROR: NETLEN_SSH_HOST is not configured."; exit 1; }
          test -n "${NETLEN_SSH_USER:-}" || { echo "ERROR: NETLEN_SSH_USER is not configured."; exit 1; }
          test -n "${NETLEN_SSH_PRIVATE_KEY:-}" || { echo "ERROR: NETLEN_SSH_PRIVATE_KEY is not configured."; exit 1; }
          test -n "${NETLEN_SSH_KNOWN_HOSTS:-}" || { echo "ERROR: NETLEN_SSH_KNOWN_HOSTS is not configured."; exit 1; }

      - name: Configure SSH
        env:
          NETLEN_SSH_PRIVATE_KEY: ${{ secrets.NETLEN_SSH_PRIVATE_KEY }}
          NETLEN_SSH_KNOWN_HOSTS: ${{ secrets.NETLEN_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$NETLEN_SSH_PRIVATE_KEY" > ~/.ssh/netlen_deploy_key
          chmod 600 ~/.ssh/netlen_deploy_key
          printf '%s\n' "$NETLEN_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Test SSH connection
        env:
          NETLEN_SSH_HOST: ${{ vars.NETLEN_SSH_HOST }}
          NETLEN_SSH_USER: ${{ vars.NETLEN_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/netlen_deploy_key \
            -p "$NETLEN_SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "$NETLEN_SSH_USER@$NETLEN_SSH_HOST" \
            'printf "Netlen SSH authentication OK\\n"'

      - name: Upload deployment payload to Netlen
        env:
          NETLEN_SSH_HOST: ${{ vars.NETLEN_SSH_HOST }}
          NETLEN_SSH_USER: ${{ vars.NETLEN_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/netlen_deploy_key \
            -p "$NETLEN_SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "$NETLEN_SSH_USER@$NETLEN_SSH_HOST" \
            "mkdir -p '$NETLEN_DEPLOY_PATH/.deploy/${GITHUB_SHA}'"

          tar -C deploy-payload -czf - . | \
            ssh -i ~/.ssh/netlen_deploy_key \
              -p "$NETLEN_SSH_PORT" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              "$NETLEN_SSH_USER@$NETLEN_SSH_HOST" \
              "tar -xzf - -C '$NETLEN_DEPLOY_PATH/.deploy/${GITHUB_SHA}'"

      - name: Activate deployment on Netlen
        env:
          NETLEN_SSH_HOST: ${{ vars.NETLEN_SSH_HOST }}
          NETLEN_SSH_USER: ${{ vars.NETLEN_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/netlen_deploy_key \
            -p "$NETLEN_SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "$NETLEN_SSH_USER@$NETLEN_SSH_HOST" \
            "DEPLOY_PATH='$NETLEN_DEPLOY_PATH' DEPLOY_SHA='$GITHUB_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          RELEASE="$DEPLOY_PATH/.deploy/$DEPLOY_SHA"
          test -f "$RELEASE/app.js"
          test -f "$RELEASE/.output/server/index.mjs"
          test -f "$RELEASE/.output/nitro.json"

          rm -rf "$DEPLOY_PATH/.output.next"
          mv "$RELEASE/.output" "$DEPLOY_PATH/.output.next"
          rm -rf "$DEPLOY_PATH/.output"
          mv "$DEPLOY_PATH/.output.next" "$DEPLOY_PATH/.output"
          cp "$RELEASE/app.js" "$DEPLOY_PATH/app.js"

          mkdir -p "$DEPLOY_PATH/tmp"
          touch "$DEPLOY_PATH/tmp/restart.txt"
          rm -rf "$DEPLOY_PATH/.deploy/$DEPLOY_SHA"
          rmdir "$DEPLOY_PATH/.deploy" 2>/dev/null || true
          echo "Netlen deployment activated: $DEPLOY_SHA"
          REMOTE

      - name: Verify Netlen deployment
        env:
          NETLEN_SSH_HOST: ${{ vars.NETLEN_SSH_HOST }}
          NETLEN_SSH_USER: ${{ vars.NETLEN_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/netlen_deploy_key \
            -p "$NETLEN_SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "$NETLEN_SSH_USER@$NETLEN_SSH_HOST" \
            "test -f '$NETLEN_DEPLOY_PATH/app.js' && test -f '$NETLEN_DEPLOY_PATH/.output/server/index.mjs' && test -f '$NETLEN_DEPLOY_PATH/.output/nitro.json' && echo 'Netlen public_html deployment verified.'"
