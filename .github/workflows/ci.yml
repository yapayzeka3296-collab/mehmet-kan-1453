name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - '.output/**'

permissions:
  contents: write

jobs:
  validate:
    name: Lint, TypeScript and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Production build with memory measurement
        run: |
          set -e
          echo "Starting MySkyParcel production build with resource measurement..."
          /usr/bin/time -v -o build-resource-usage.txt npm run build
          echo "=== Build resource usage ==="
          cat build-resource-usage.txt

      - name: Inspect build output
        run: |
          set -e
          test -f .output/server/index.mjs
          echo "Production server entry exists: .output/server/index.mjs"
          du -sh .output

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Commit production build for cPanel
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .output
          if git diff --cached --quiet; then
            echo "Production build is already up to date."
          else
            git commit -m "chore: update Netlen production build [skip ci]"
            git push origin HEAD:main
          fi
