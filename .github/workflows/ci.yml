name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - '.output/**'

permissions:
  contents: write

concurrency:
  group: netlen-production
  cancel-in-progress: false

jobs:
  validate:
    name: Lint, TypeScript and Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Production build with memory measurement
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: |
          set -e
          echo "Starting MySkyParcel production build with resource measurement..."
          /usr/bin/time -v -o build-resource-usage.txt npm run build
          echo "=== Build resource usage ==="
          cat build-resource-usage.txt

      - name: Inspect build output
        run: |
          set -e
          test -f .output/server/index.mjs
          test -f .output/nitro.json
          test -d .output/public
          echo "Production server entry exists: .output/server/index.mjs"
          echo "Nitro metadata exists: .output/nitro.json"
          echo "Production public directory exists: .output/public"
          du -sh .output

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Commit production build for cPanel
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .output
          if git diff --cached --quiet; then
            echo "Production build is already up to date."
          else
            git commit -m "chore: update Netlen production build [skip ci]"
            git push origin HEAD:main
          fi
          echo "Deployment source commit: $(git rev-parse HEAD)"

  deploy-netlen:
    name: Trigger Netlen cPanel deployment
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate Netlen deployment secret
        env:
          CPANEL_DEPLOY_WEBHOOK_URL: ${{ secrets.CPANEL_DEPLOY_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CPANEL_DEPLOY_WEBHOOK_URL:-}" ]; then
            echo "ERROR: CPANEL_DEPLOY_WEBHOOK_URL GitHub secret is not configured."
            echo "Add the Netlen/cPanel deployment webhook as a repository Actions secret with this exact name."
            exit 1
          fi

      - name: Trigger cPanel deployment webhook
        env:
          CPANEL_DEPLOY_WEBHOOK_URL: ${{ secrets.CPANEL_DEPLOY_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          http_code="$(curl --fail-with-body --show-error --silent --output "$response_file" --write-out '%{http_code}' \
            --retry 3 --retry-delay 5 --retry-all-errors \
            --connect-timeout 15 --max-time 60 \
            -X POST \
            -H 'Accept: application/json' \
            "$CPANEL_DEPLOY_WEBHOOK_URL")"
          echo "Netlen cPanel webhook HTTP status: ${http_code}"
          if [ -s "$response_file" ]; then
            echo "Netlen cPanel webhook response:"
            cat "$response_file"
          fi
          echo "Netlen cPanel deployment webhook triggered successfully."
          rm -f "$response_file"
