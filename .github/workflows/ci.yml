name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Lint, TypeScript and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Production build with memory measurement
        run: |
          echo "Starting MySkyParcel production build with resource measurement..."
          /usr/bin/time -v -o build-resource-usage.txt npm run build
          echo "=== Build resource usage ==="
          cat build-resource-usage.txt

      - name: Inspect build output
        run: |
          echo "Build output directories:"
          find . -maxdepth 3 -type d \( -name '.output' -o -name 'dist' -o -name 'build' \) -print
          echo "Top-level files/directories:"
          ls -la

      - name: Prepare production build artifact
        run: |
          set -e
          rm -rf production-build
          if [ -d ".output" ]; then
            cp -R .output production-build
          elif [ -d "dist" ]; then
            cp -R dist production-build
          elif [ -d "build" ]; then
            cp -R build production-build
          else
            echo "No supported production build directory was found."
            exit 1
          fi
          echo "Prepared artifact:"
          find production-build -maxdepth 3 -type f -print | head -200

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: myskyparcel-production-build
          path: production-build/
          if-no-files-found: error
          retention-days: 7

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint
