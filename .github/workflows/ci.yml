name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - '.output/**'

permissions:
  contents: write

concurrency:
  group: netlen-production
  cancel-in-progress: false

jobs:
  validate:
    name: Lint, TypeScript and Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Production build with memory measurement
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: |
          set -euo pipefail
          echo "Starting MySkyParcel production build with resource measurement..."
          /usr/bin/time -v -o build-resource-usage.txt npm run build
          echo "=== Build resource usage ==="
          cat build-resource-usage.txt

      - name: Inspect build output
        run: |
          set -euo pipefail
          test -f .output/server/index.mjs
          test -f .output/nitro.json
          test -d .output/public
          echo "Production server entry exists: .output/server/index.mjs"
          echo "Nitro metadata exists: .output/nitro.json"
          echo "Production public directory exists: .output/public"
          du -sh .output

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Commit production build for cPanel
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .output
          if git diff --cached --quiet; then
            echo "Production build is already up to date."
          else
            git commit -m "chore: update Netlen production build [skip ci]"
            git push origin HEAD:main
          fi
          echo "Production deployment commit: $(git rev-parse HEAD)"

  deploy-netlen:
    name: Push to Netlen cPanel Git repository
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout production commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate cPanel deployment secrets
        env:
          CPANEL_GIT_SSH_URL: ${{ secrets.CPANEL_GIT_SSH_URL }}
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${CPANEL_GIT_SSH_URL:-}" || { echo "ERROR: CPANEL_GIT_SSH_URL is not configured."; exit 1; }
          test -n "${CPANEL_SSH_PRIVATE_KEY:-}" || { echo "ERROR: CPANEL_SSH_PRIVATE_KEY is not configured."; exit 1; }
          test -n "${CPANEL_SSH_KNOWN_HOSTS:-}" || { echo "ERROR: CPANEL_SSH_KNOWN_HOSTS is not configured."; exit 1; }
          echo "cPanel deployment secrets are configured."

      - name: Configure SSH for Netlen cPanel
        env:
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$CPANEL_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Push exact production commit to cPanel-managed repository
        env:
          CPANEL_GIT_SSH_URL: ${{ secrets.CPANEL_GIT_SSH_URL }}
        run: |
          set -euo pipefail
          git remote remove cpanel 2>/dev/null || true
          git remote add cpanel "$CPANEL_GIT_SSH_URL"
          production_sha="$(git rev-parse HEAD)"
          echo "Pushing production commit ${production_sha} to Netlen cPanel repository..."
          git push cpanel HEAD:main
          echo "Netlen cPanel repository accepted production commit ${production_sha}."
          echo "cPanel's post-receive hook should now execute the checked-in .cpanel.yml automatically."
