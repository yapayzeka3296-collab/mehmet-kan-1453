name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Security, TypeScript, Lint and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Production build
        run: npm run build

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Inspect build output
        run: |
          echo "Build output directories:"
          find . -maxdepth 3 -type d \( -name '.output' -o -name 'dist' -o -name 'build' \) -print
          echo "Top-level files/directories:"
          ls -la
