<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 526" role="img" aria-label="MySkyParcel — Gökyüzünde Sana Özel Bir Yer">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4D06F"/>
      <stop offset="0.5" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#B88620"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Transparent background: the site header's deep navy (#050B1A) shows through naturally. -->
  <g fill="none" stroke="url(#gold)" stroke-width="7" stroke-linecap="round" opacity="0.95">
    <path d="M285 230 C420 55 690 45 790 230"/>
    <path d="M285 421 H475"/>
    <path d="M1070 421 H1260"/>
  </g>

  <g fill="url(#gold)" filter="url(#softGlow)">
    <path d="M515 115 l9 30 30 9-30 9-9 30-9-30-30-9 30-9z"/>
    <path d="M680 55 l10 36 36 10-36 10-10 36-10-36-36-10 36-10z"/>
    <path d="M760 145 l7 25 25 7-25 7-7 25-7-25-25-7 25-7z"/>
    <path d="M435 150 l6 21 21 6-21 6-6 21-6-21-21-6 21-6z"/>
    <path d="M360 190 l5 18 18 5-18 5-5 18-5-18-18-5 18-5z"/>
  </g>

  <text x="180" y="350" font-family="Georgia,Times New Roman,serif" font-size="126" letter-spacing="2" fill="#F8FAFC">MY SKY</text>
  <text x="765" y="350" font-family="Georgia,Times New Roman,serif" font-size="126" letter-spacing="2" fill="url(#gold)">PARCEL</text>
  <text x="768" y="435" text-anchor="middle" font-family="Georgia,Times New Roman,serif" font-size="45" letter-spacing="5" fill="#CBD5E1">GÖKYÜZÜNDE SANA ÖZEL BİR YER</text>
</svg>
