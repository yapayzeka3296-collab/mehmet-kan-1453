<svg xmlns="http://www.w3.org/2000/svg" width="1122" height="794" viewBox="0 0 1122 794" role="img" aria-labelledby="title desc">
  <title id="title">MySkyParcel Digital Sertifika</title>
  <desc id="desc">MySkyParcel Digital certificate template</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071326"/><stop offset="0.55" stop-color="#102541"/><stop offset="1" stop-color="#06101f"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7f6a35" stop-opacity="0"/><stop offset="0.5" stop-color="#d8bb68"/><stop offset="1" stop-color="#7f6a35" stop-opacity="0"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1122" height="794" rx="24" fill="url(#bg)"/>
  <rect x="28" y="28" width="1066" height="738" rx="18" fill="none" stroke="#c9ad5c" stroke-opacity=".55" stroke-width="2"/>
  <path d="M72 138H1050M72 656H1050" stroke="url(#line)" stroke-width="2"/>
  <circle cx="561" cy="84" r="20" fill="#d8bb68" fill-opacity=".12" stroke="#d8bb68"/>
  <path d="M551 84h20M561 74v20" stroke="#d8bb68"/>
  <text x="561" y="91" text-anchor="middle" fill="#f1df9b" font-family="Georgia,serif" font-size="26" letter-spacing="5">MY SKY PARCEL</text>
  <text x="561" y="178" text-anchor="middle" fill="#d8bb68" font-family="Arial,sans-serif" font-size="18" letter-spacing="8">DIGITAL CERTIFICATE</text>
  <text x="561" y="278" text-anchor="middle" fill="#f8fafc" font-family="Georgia,serif" font-size="{{HOLDER_NAME_FONT_SIZE}}" font-weight="600">{{HOLDER_NAME}}</text>
  <text x="561" y="315" text-anchor="middle" fill="#9fb0c5" font-family="Arial,sans-serif" font-size="15" letter-spacing="2">MY SKYPARCEL PARSEL SAHİPLİĞİ</text>
  <text x="561" y="394" text-anchor="middle" fill="#d8bb68" font-family="Arial,sans-serif" font-size="18" letter-spacing="3">{{PARCEL_CODE}}</text>
  <text x="561" y="430" text-anchor="middle" fill="#d7e0ea" font-family="Arial,sans-serif" font-size="16">{{CITY_NAME}} • DİJİTAL</text>
  <text x="561" y="503" text-anchor="middle" fill="#8fa0b5" font-family="Arial,sans-serif" font-size="12" letter-spacing="1">SERTİFİKA NUMARASI</text>
  <text x="561" y="530" text-anchor="middle" fill="#f8fafc" font-family="monospace" font-size="18">{{CERTIFICATE_NUMBER}}</text>
  <text x="86" y="706" fill="#7f91a7" font-family="Arial,sans-serif" font-size="12">DÜZENLENME: {{ISSUE_DATE}}</text>
  <text x="1036" y="706" text-anchor="end" fill="#7f91a7" font-family="Arial,sans-serif" font-size="12">{{FINGERPRINT_SHORT}}</text>
  <rect x="910" y="540" width="130" height="130" rx="8" fill="#fff"/>
  <image x="920" y="550" width="110" height="110" preserveAspectRatio="xMidYMid meet" href="{{QR_IMAGE_URL}}"/>
  <text x="975" y="688" text-anchor="middle" fill="#7f91a7" font-family="Arial,sans-serif" font-size="10">DOĞRULAMA QR</text>
</svg>
