  <radialGradient id="sun" cx="86%" cy="28%" r="35%"><stop offset="0" stop-color="#fff8d9" stop-opacity=".95"/><stop offset=".18" stop-color="#ffe9ad" stop-opacity=".65"/><stop offset="1" stop-color="#ffe9ad" stop-opacity="0"/></radialGradient>
